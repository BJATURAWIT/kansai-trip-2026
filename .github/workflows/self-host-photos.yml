name: Self-host travel photos
on:
  push:
    branches: [main]
    paths:
      - 'scripts/download-photos.mjs'
      - 'data/gallery.js'
      - '.github/workflows/self-host-photos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Download and verify licensed Commons photos
        run: node scripts/download-photos.mjs
      - name: Commit local photos and attribution
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/photos
          if ! git diff --cached --quiet; then
            git commit -m 'Self-host licensed Kansai travel photos'
            git push
          fi
